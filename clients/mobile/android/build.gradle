allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    // Keep plugin build classpaths aligned with settings.gradle and SDK 36.
    // Older Flutter plugins otherwise resolve separate AGP distributions.
    buildscript.configurations.matching { it.name == "classpath" }.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.android.tools.build" && details.requested.name == "gradle") {
                details.useVersion("8.13.2")
                details.because("All Android modules use the application's SDK 36 toolchain")
            }
        }
    }
    plugins.withId("com.android.library") {
        extensions.getByName("androidComponents").finalizeDsl { library ->
            library.compileSdk = 36
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
