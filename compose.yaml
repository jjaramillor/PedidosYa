services:
  web:
    build:
      context: ./clients/web
    ports: ["127.0.0.1:8081:80"]
    depends_on:
      api: {condition: service_started}
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d delivery"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
  otel:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./infra/otel/config.yaml:/etc/otel/config.yaml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:8889:8889"]
    depends_on: [jaeger]
  api:
    build:
      context: .
      dockerfile: src/Delivery.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=delivery;Username=delivery;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379
      Identity__JwtKey: ${JWT_KEY:?Set JWT_KEY}
      Identity__OtpKey: ${OTP_KEY:?Set OTP_KEY}
      Identity__SmtpHost: mailpit
      Identity__SmtpPort: 1025
      Identity__SmtpTls: "false"
      DataProtection__KeyPath: /app/keys
      Payments__Provider: ${PAYMENT_PROVIDER:-sandbox}
      Payments__AccessToken: ${PAYMENT_ACCESS_TOKEN:-}
      Payments__PublicKey: ${PAYMENT_PUBLIC_KEY:-}
      Payments__WebhookSecret: ${PAYMENT_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4317
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["api-keys:/app/keys", "api-documents:/app/uploads"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_started}
      jaeger: {condition: service_started}
      otel: {condition: service_started}
volumes:
  postgres-data:
  redis-data:
  api-keys:
  api-documents:
